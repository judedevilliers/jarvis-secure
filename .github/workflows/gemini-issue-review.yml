name: Independent Gemini issue review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  review:
    if: >-
      github.event.issue.number == 1 &&
      !github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/gemini-review')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Ask Gemini about the public issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REVIEW_REQUEST: ${{ github.event.comment.body }}
        run: python3 ai-collab/gemini_issue_review.py
